name: News CI

on:
  pull_request:
    paths:
      - ".github/workflows/news-ci.yml"
      - ".github/workflows/news-mirror-refresh.yml"
      - ".vercelignore"
      - ".env.example"
      - "assets/news-*"
      - "assets/fonts/PretendardVariable.woff2"
      - "api/news-*"
      - "data/news/**"
      - "data/news-feed.json"
      - "data/news-details.json"
      - "index.html"
      - "lib/news-image-policy.js"
      - "news/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/generate-news-feed.ts"
      - "scripts/news-*.ts"
      - "scripts/refresh-news-mirror.ts"
      - "scripts/test-news*.ts"
      - "scripts/verify-vercel-bundle.ts"
      - "vercel.json"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/news-ci.yml"
      - ".github/workflows/news-mirror-refresh.yml"
      - ".vercelignore"
      - ".env.example"
      - "assets/news-*"
      - "assets/fonts/PretendardVariable.woff2"
      - "api/news-*"
      - "data/news/**"
      - "data/news-feed.json"
      - "data/news-details.json"
      - "index.html"
      - "lib/news-image-policy.js"
      - "news/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/generate-news-feed.ts"
      - "scripts/news-*.ts"
      - "scripts/refresh-news-mirror.ts"
      - "scripts/test-news*.ts"
      - "scripts/verify-vercel-bundle.ts"
      - "vercel.json"

permissions:
  contents: read

jobs:
  news-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run standalone news release gate
        run: npm run ci:news
