name: News Mirror Refresh

on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-mirror-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NEWS_MIRROR_REPORT: /tmp/news-mirror-refresh-report.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh KCNA and Rodong mirror
        env:
          DPRK_NEWS_CRAWL_PROXY: ${{ secrets.DPRK_NEWS_CRAWL_PROXY }}
        run: >-
          npm run refresh:news --
          --enrich-inline-images
          --max-list-pages 1
          --max-documents 96
          --timeout-ms 120000
          --max-age-days 4
          --report "$NEWS_MIRROR_REPORT"

      - name: Reject unexpected generated paths
        shell: bash
        run: |
          unexpected=0
          while IFS= read -r -d '' file; do
            case "$file" in
              data/news/*|data/news-feed.json|data/news-details.json)
                ;;
              *)
                echo "Unexpected refresh change: $file"
                unexpected=1
                ;;
            esac
          done < <(
            {
              git diff --name-only -z
              git diff --cached --name-only -z
              git ls-files --others --exclude-standard -z
            } | sort -zu
          )
          if [[ "$unexpected" -ne 0 ]]; then
            exit 1
          fi

      - name: Run standalone news release gate
        run: npm run ci:news

      - name: Recheck generated paths after all gates
        shell: bash
        run: |
          unexpected=0
          while IFS= read -r -d '' file; do
            case "$file" in
              data/news/*|data/news-feed.json|data/news-details.json)
                ;;
              *)
                echo "Unexpected change after gates: $file"
                unexpected=1
                ;;
            esac
          done < <(
            {
              git diff --name-only -z
              git diff --cached --name-only -z
              git ls-files --others --exclude-standard -z
            } | sort -zu
          )
          if [[ "$unexpected" -ne 0 ]]; then
            exit 1
          fi

      - name: Commit refreshed mirror
        shell: bash
        run: |
          git add -- \
            data/news-feed.json \
            data/news-details.json
          git add -A -- data/news
          if git diff --cached --quiet; then
            echo "News mirror is already current; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh KCNA and Rodong mirror"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-mirror-refresh-report-${{ github.run_id }}
          path: ${{ env.NEWS_MIRROR_REPORT }}
          if-no-files-found: ignore
          retention-days: 14
