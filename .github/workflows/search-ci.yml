name: Search CI

on:
  pull_request:
    paths:
      - ".github/workflows/search-ci.yml"
      - ".github/workflows/search-production-release.yml"
      - ".vercelignore"
      - "api/search-*.js"
      - "assets/search-*"
      - "components/**"
      - "data/search/**"
      - "index.html"
      - "app.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/audit-search-production.ts"
      - "scripts/cache-search-assets.ts"
      - "scripts/ci-search-release.ts"
      - "scripts/import-*.ts"
      - "scripts/ingest-search-documents.ts"
      - "scripts/preflight-search-release.ts"
      - "scripts/release-search-production.ts"
      - "scripts/script-env.ts"
      - "scripts/search-*.ts"
      - "scripts/seed-search.ts"
      - "scripts/smoke-search-crawl.ts"
      - "scripts/sync-meilisearch.ts"
      - "scripts/test-search-correctness.ts"
      - "scripts/upload-search-assets-r2.ts"
      - "scripts/validate-search-index.ts"
      - "scripts/verify-search-production.ts"
      - "search/**"
      - "styles.css"
      - "test/fixtures/search/**"
      - "vercel.json"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/search-ci.yml"
      - ".github/workflows/search-production-release.yml"
      - ".vercelignore"
      - "api/search-*.js"
      - "assets/search-*"
      - "components/**"
      - "data/search/**"
      - "index.html"
      - "app.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/audit-search-production.ts"
      - "scripts/cache-search-assets.ts"
      - "scripts/ci-search-release.ts"
      - "scripts/import-*.ts"
      - "scripts/ingest-search-documents.ts"
      - "scripts/preflight-search-release.ts"
      - "scripts/release-search-production.ts"
      - "scripts/script-env.ts"
      - "scripts/search-*.ts"
      - "scripts/seed-search.ts"
      - "scripts/smoke-search-crawl.ts"
      - "scripts/sync-meilisearch.ts"
      - "scripts/test-search-correctness.ts"
      - "scripts/upload-search-assets-r2.ts"
      - "scripts/validate-search-index.ts"
      - "scripts/verify-search-production.ts"
      - "search/**"
      - "styles.css"
      - "test/fixtures/search/**"
      - "vercel.json"

permissions:
  contents: read

jobs:
  search-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run search release gate
        run: npm run ci:search
